<div class="app">
  <h1>📒 Note Manager</h1>

  <!-- Form per aggiungere note -->
  <app-note-form (addNote)="addNote($event)"></app-note-form>

  <!-- Lista delle note -->
  <app-note-list
    [notes]="notes"
    (deleteNote)="deleteNote($event)"
    (updateNote)="updateNote($event)"
  ></app-note-list>
</div>
